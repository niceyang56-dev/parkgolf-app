
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#086cc5">

  <title>파크골프 참가 신청</title>

  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f0f5fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #073b65;
    }

    .card {
      max-width: 460px;
      margin: 30px auto;
      padding: 24px 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0001;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 20px;
    }

    button {
      width: 100%;
      padding: 16px 12px;
      border: 0;
      border-radius: 10px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #086cc5;
      color: white;
    }

    .primary:disabled {
      background: #538fbe;
      cursor: wait;
    }

    .accordion {
      margin-top: 14px;
      background: #e9f2fa;
      color: #073b65;
    }

    .guide {
      display: none;
      margin-top: 12px;
      padding: 15px;
      background: #f5f8fb;
      border: 1px solid #d5e2ed;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      line-height: 1.6;
    }

    .guide.show {
      display: block;
    }

    .install {
      background: #086cc5;
      color: white;
      margin-bottom: 12px;
    }

    .instructions {
      display: none;
    }

    .instructions.show {
      display: block;
    }

    .instructions p {
      margin: 10px 0;
    }

    .loading-note {
      display: none;
      margin-top: 12px;
      font-size: 16px;
      color: #49667d;
    }

    .loading-note.show {
      display: block;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🏌️ 파크골프 참가 신청</h1>

    <!-- ① 참가 신청 화면 열기 -->
    <button
      class="primary"
      id="openEventBtn"
      onclick="openEvent()">
      참가 신청 화면 열기
    </button>

    <div
      class="loading-note"
      id="loadingNote"
      role="status"
      aria-live="polite">
      잠시만 기다려 주십시오.
    </div>

    <!-- ② 홈 화면 바로가기 아코디언 -->
    <button
      class="accordion"
      id="guideBtn"
      aria-expanded="false"
      aria-controls="installGuide"
      onclick="toggleGuide()">
      홈 화면에 바로가기 추가 ▼
    </button>

    <div class="guide" id="installGuide">

      <!-- 설치하기 버튼 -->
      <button class="install" onclick="installApp()">
        📲 홈 화면에 설치하기
      </button>

      <!-- 브라우저별 설치 안내 -->
      <div class="instructions" id="instructions">

        <p>
          <b>① 카카오톡에서 접속한 경우</b><br>
          화면의 점 3개(⋮) →
          다른 브라우저로 열기
        </p>

        <p>
          <b>② 삼성 인터넷에서 홈 화면에 추가</b><br>
          하단 점 3개(⋮) →
          현재 페이지 추가 →
          홈 화면 → 추가
        </p>

        <p>
          <b>③ 크롬에서 홈 화면에 추가</b><br>
          메뉴(⋮) →
          홈 화면에 추가 또는 앱 설치
        </p>

        <p>
          <b>④ 아이폰 Safari에서 홈 화면에 추가</b><br>
          공유 버튼 →
          홈 화면에 추가
        </p>

      </div>

    </div>

  </div>

  <script>
    /**************************************************
     * 대회별 참가 신청 연결
     * 2026.11.23 수정 완성본
     *
     * - 기존 GS 웹앱 유지
     * - 공유 URL의 eventId, preview 전달
     * - 대회ID 기억
     * - PWA 자동 연결
     * - 삼성 인터넷 일반 바로가기 자동 연결
     * - home=1 전용 주소 지원
     **************************************************/

    const GS_BASE_URL =
      "https://script.google.com/macros/s/" +
      "AKfycbySUNGARDitfAqrmdNQoCO1Pb55l72CsMGznm1eay56Zd24ufCZBXfBX467NbIDa4M9" +
      "/exec";

    const PG_EVENT_STORAGE_KEY =
      "PG_LAST_EVENT_ID";

    /**************************************************
     * 대회ID 형식 확인
     **************************************************/
    function PG_isValidEventId_(id) {

      return /^PG-\d{4}-\d{3,}$/.test(id || "");
    }

    /**************************************************
     * 대회ID 기억
     **************************************************/
    function PG_saveEventId_(eventId) {

      if (!PG_isValidEventId_(eventId)) return;

      try {

        localStorage.setItem(
          PG_EVENT_STORAGE_KEY,
          eventId
        );

      } catch (error) {

        console.warn(
          "대회ID 저장 실패:",
          error
        );
      }
    }

    /**************************************************
     * 기억된 대회ID 조회
     **************************************************/
    function PG_getSavedEventId_() {

      try {

        const savedId =
          localStorage.getItem(
            PG_EVENT_STORAGE_KEY
          );

        return PG_isValidEventId_(savedId)
          ? savedId
          : "";

      } catch (error) {

        console.warn(
          "대회ID 조회 실패:",
          error
        );

        return "";
      }
    }

    /**************************************************
     * 참가 신청 화면 열기
     *
     * - 버튼 터치 즉시 연결 중 표시
     * - 중복 터치 방지
     * - URL 대회ID 우선
     * - 없으면 기억된 대회ID 사용
     **************************************************/
    function openEvent() {

      const btn =
        document.getElementById("openEventBtn");

      if (btn.disabled) return;

      // 버튼 터치 즉시 표시 변경
      btn.disabled = true;
      btn.textContent =
        "⏳ 참가 신청 화면 연결 중...";

      document.getElementById("loadingNote")
        .classList.add("show");

      // 공유 URL에서 대회 정보 읽기
      const params =
        new URLSearchParams(window.location.search);

      const requestedId = params.get("eventId");
      const preview = params.get("preview");

      const eventId =
        PG_isValidEventId_(requestedId)
          ? requestedId
          : PG_getSavedEventId_() || "PG-2026-004";

      // 현재 대회ID 기억
      PG_saveEventId_(eventId);

      // 기존 GS 웹앱 주소 생성
      const url = new URL(GS_BASE_URL);

      url.searchParams.set("eventId", eventId);

      if (preview && /^\d+$/.test(preview)) {
        url.searchParams.set("preview", preview);
      }

      // 참가 신청 화면으로 이동
      window.location.href = url.toString();
    }

    /**************************************************
     * 홈 화면 바로가기 및 PWA 자동 연결
     * 2026.11.23
     *
     * - home=1 : 일반 바로가기에서도 자동 연결
     * - PWA : 자동 연결
     * - 일반 공유 링크 : 기존 두 버튼 유지
     **************************************************/
    function PG_checkStandaloneAutoOpen_() {

      const params =
        new URLSearchParams(window.location.search);

      const requestedId = params.get("eventId");

      // ① 공유 URL에 대회ID가 있으면 기억
      if (PG_isValidEventId_(requestedId)) {

        PG_saveEventId_(requestedId);
      }

      // ② 홈 화면 전용 주소 확인
      const isHomeLink =
        params.get("home") === "1";

      // ③ 독립 실행형 PWA 확인
      const isStandalone =
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

      // ④ 일반 공유 링크는 기존 화면 유지
      if (!isHomeLink && !isStandalone) return;

      // ⑤ URL 대회ID 우선
      const eventId =
        PG_isValidEventId_(requestedId)
          ? requestedId
          : PG_getSavedEventId_();

      // ⑥ 대회ID가 없으면 자동 이동하지 않음
      if (!eventId) return;

      // ⑦ 기존 openEvent()에 대회ID 전달
      const url = new URL(window.location.href);

      url.searchParams.set("eventId", eventId);

      window.history.replaceState(
        null,
        "",
        url.toString()
      );

      // ⑧ 참가 신청 화면 자동 이동
      openEvent();
    }

    /**************************************************
     * 화면 준비 후 자동 이동 확인
     **************************************************/
    if (document.readyState === "loading") {

      document.addEventListener(
        "DOMContentLoaded",
        PG_checkStandaloneAutoOpen_
      );

    } else {

      PG_checkStandaloneAutoOpen_();
    }

    /**************************************************
     * 다른 화면에서 뒤로 돌아왔을 때
     * 버튼 상태 복원
     **************************************************/
    window.addEventListener(
      "pageshow",
      function() {

        const btn =
          document.getElementById("openEventBtn");

        btn.disabled = false;
        btn.textContent =
          "참가 신청 화면 열기";

        document.getElementById("loadingNote")
          .classList.remove("show");
      }
    );

    /**************************************************
     * 홈 화면 설치 안내 아코디언
     **************************************************/
    function toggleGuide() {

      const guide =
        document.getElementById("installGuide");

      const button =
        document.getElementById("guideBtn");

      const opened =
        guide.classList.toggle("show");

      button.setAttribute(
        "aria-expanded",
        String(opened)
      );

      button.textContent = opened
        ? "홈 화면에 바로가기 추가 ▲"
        : "홈 화면에 바로가기 추가 ▼";
    }

    /**************************************************
     * 홈 화면 설치 확인창 호출
     *
     * 설치 확인창을 지원하지 않는 브라우저는
     * 설치 안내문 표시
     **************************************************/
    let deferredPrompt = null;

    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();
        deferredPrompt = event;
      }
    );

    async function installApp() {

      if (deferredPrompt) {

        const promptEvent = deferredPrompt;
        deferredPrompt = null;

        try {

          await promptEvent.prompt();

        } catch (error) {

          console.warn(
            "설치 요청 실패:",
            error
          );

          showInstructions();
        }

      } else {

        showInstructions();
      }
    }

    function showInstructions() {

      document.getElementById("instructions")
        .classList.add("show");
    }

    /**************************************************
     * PWA 서비스 워커 등록
     * 기존 기능 유지
     **************************************************/
    if ("serviceWorker" in navigator) {

      navigator.serviceWorker
        .register("./sw.js")

        .then(function() {

          console.log(
            "PWA 서비스 워커 등록 완료"
          );
        })

        .catch(function(error) {

          console.error(
            "PWA 등록 실패:",
            error
          );
        });
    }
  </script>

</body>
</html>
