<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#086cc5">

  <title>파크골프 참가 신청</title>

  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f0f5fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #073b65;
    }

    .card {
      max-width: 460px;
      margin: 30px auto;
      padding: 24px 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0001;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 20px;
    }

    button {
      width: 100%;
      padding: 16px 12px;
      border: 0;
      border-radius: 10px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #086cc5;
      color: white;
    }

    .primary:disabled {
      background: #538fbe;
      cursor: wait;
    }

    .accordion {
      margin-top: 14px;
      background: #e9f2fa;
      color: #073b65;
    }

    .guide {
      display: none;
      margin-top: 12px;
      padding: 15px;
      background: #f5f8fb;
      border: 1px solid #d5e2ed;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      line-height: 1.6;
    }

    .guide.show {
      display: block;
    }

    .install {
      background: #086cc5;
      color: white;
      margin-bottom: 12px;
    }

    .instructions {
      display: none;
    }

    .instructions.show {
      display: block;
    }

    .instructions p {
      margin: 10px 0;
    }

    .loading-note {
      display: none;
      margin-top: 12px;
      font-size: 16px;
      color: #49667d;
    }

    .loading-note.show {
      display: block;
    }

    .setup-note {
      margin: 12px 0 18px;
      font-size: 17px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🏌️ 파크골프 참가 신청</h1>

    <!-- 일반 공유 링크 화면 -->
    <div id="normalPage">

      <button
        class="primary"
        id="openEventBtn"
        onclick="openEvent()">
        참가 신청 화면 열기
      </button>

      <div
        class="loading-note"
        id="loadingNote"
        role="status"
        aria-live="polite">
        잠시만 기다려 주십시오.
      </div>

      <button
        class="accordion"
        id="guideBtn"
        aria-expanded="false"
        aria-controls="installGuide"
        onclick="toggleGuide()">
        홈 화면에 바로가기 추가 ▼
      </button>

      <div class="guide" id="installGuide">

        <button
          class="install"
          id="installBtn"
          onclick="installApp()">
          📲 홈 화면 바로가기 준비
        </button>

        <div class="instructions" id="instructions">

          <p>
            <b>① 카카오톡·밴드에서 접속한 경우</b><br>
            메뉴(⋮) →
            다른 브라우저로 열기
          </p>

          <p>
            <b>② 삼성 인터넷</b><br>
            홈 화면 바로가기 준비 버튼을 누른 후<br>
            메뉴(☰ 또는 ⋮) →
            홈 화면에 추가 → 추가
          </p>

          <p>
            <b>③ 크롬</b><br>
            메뉴(⋮) →
            홈 화면에 추가
          </p>

          <p>
            <b>④ 아이폰 Safari</b><br>
            공유 버튼 →
            홈 화면에 추가
          </p>

          <p>
            <b>⑤ 등록 완료 후</b><br>
            홈 화면 아이콘을 누르면
            참가 신청 화면으로 바로 이동합니다.
          </p>

        </div>

      </div>
    </div>

    <!-- 기존 등록 전용 화면 호환 유지 -->
    <div id="setupPage" style="display:none;">

      <div class="setup-note">
        <b>홈 화면 바로가기 등록</b><br>
        아래 버튼을 눌러 등록을 준비하십시오.
      </div>

      <button
        class="primary"
        id="prepareHomeBtn"
        onclick="prepareHomeShortcut()">
        📲 홈 화면 바로가기 준비
      </button>

      <div
        id="setupInstructions"
        class="guide"
        style="display:block;">

        <p>
          <b>삼성 인터넷</b><br>
          메뉴(☰ 또는 ⋮) →
          홈 화면에 추가 → 추가
        </p>

      </div>
    </div>

  </div>

  <script>

    /**************************************************
     * 2026.11.23
     * 파크골프 참가 신청 GitHub 연결
     *
     * 일반 공유 URL : 안내 화면
     * 홈 화면 등록 : home=1 주소 준비
     * 홈 화면 실행 : 참가 신청 자동 연결
     * 기존 setup=1 기능 유지
     **************************************************/

    const GS_BASE_URL =
      "https://script.google.com/macros/s/" +
      "AKfycbySUNGARDitfAqrmdNQoCO1Pb55l72CsMGznm1eay56Zd24ufCZBXfBX467NbIDa4M9" +
      "/exec";

    const PG_EVENT_STORAGE_KEY =
      "PG_LAST_EVENT_ID";

    /**************************************************
     * 대회ID 형식 확인
     **************************************************/
    function PG_isValidEventId_(id) {
      return /^PG-\d{4}-\d{3,}$/.test(id || "");
    }

    /**************************************************
     * 대회ID 저장
     **************************************************/
    function PG_saveEventId_(eventId) {

      if (!PG_isValidEventId_(eventId)) return;

      try {
        localStorage.setItem(
          PG_EVENT_STORAGE_KEY,
          eventId
        );
      } catch (error) {
        console.warn("대회ID 저장 실패:", error);
      }
    }

    /**************************************************
     * 기억된 대회ID 조회
     **************************************************/
    function PG_getSavedEventId_() {

      try {
        const savedId =
          localStorage.getItem(PG_EVENT_STORAGE_KEY);

        return PG_isValidEventId_(savedId)
          ? savedId
          : "";

      } catch (error) {
        return "";
      }
    }

    /**************************************************
     * 대회ID 확인
     *
     * 대회별 HTML 파일명도 확인
     **************************************************/
    function PG_getEventId_() {

      const params =
        new URLSearchParams(window.location.search);

      const requestedId = params.get("eventId");

      if (PG_isValidEventId_(requestedId)) {
        return requestedId;
      }

      const fileName =
        window.location.pathname
          .split("/")
          .pop();

      const match =
        fileName.match(
          /^(PG-\d{4}-\d{3,})\.html$/i
        );

      if (match && PG_isValidEventId_(match[1])) {
        return match[1];
      }

      return PG_getSavedEventId_();
    }

    /**************************************************
     * 참가 신청 화면 열기
     **************************************************/
    function openEvent() {

      const btn =
        document.getElementById("openEventBtn");

      if (btn.disabled) return;

      btn.disabled = true;

      btn.textContent =
        "⏳ 참가 신청 화면 연결 중...";

      document.getElementById("loadingNote")
        .classList.add("show");

      const params =
        new URLSearchParams(window.location.search);

      const eventId =
        PG_getEventId_() || "PG-2026-004";

      const preview = params.get("preview");

      PG_saveEventId_(eventId);

      const url = new URL(GS_BASE_URL);

      url.searchParams.set("eventId", eventId);

      if (preview && /^\d+$/.test(preview)) {
        url.searchParams.set("preview", preview);
      }

      window.location.href = url.toString();
    }

    /**************************************************
     * 홈 화면 바로가기 등록 준비
     *
     * 현재 페이지 주소에 home=1 추가
     * 화면 이동 없이 주소만 변경
     **************************************************/
    function prepareHomeShortcut() {

      const eventId =
        PG_getEventId_() || "PG-2026-004";

      PG_saveEventId_(eventId);

      const url = new URL(window.location.href);

      url.searchParams.delete("setup");

      url.searchParams.set("eventId", eventId);

      url.searchParams.set("home", "1");

      window.history.replaceState(
        null,
        "",
        url.toString()
      );

      const normalPage =
        document.getElementById("normalPage");

      const setupPage =
        document.getElementById("setupPage");

      if (normalPage.style.display !== "none") {

        const btn =
          document.getElementById("installBtn");

        btn.textContent =
          "✅ 바로가기 등록 준비 완료";

        btn.disabled = true;

        showInstructions();

      } else {

        const btn =
          document.getElementById("prepareHomeBtn");

        btn.textContent =
          "✅ 바로가기 등록 준비 완료";

        btn.disabled = true;

        document.querySelector(
          "#setupInstructions p"
        ).innerHTML =
          "<b>이제 브라우저 메뉴를 누르십시오.</b><br>" +
          "홈 화면에 추가 → 추가";
      }
    }

    /**************************************************
     * 최초 접속 화면 분기
     **************************************************/
    function PG_initializePage_() {

      const params =
        new URLSearchParams(window.location.search);

      const eventId = PG_getEventId_();

      if (PG_isValidEventId_(eventId)) {
        PG_saveEventId_(eventId);
      }

      // 기존 등록 전용 주소 호환
      if (params.get("setup") === "1") {

        document.getElementById("normalPage")
          .style.display = "none";

        document.getElementById("setupPage")
          .style.display = "block";

        return;
      }

      // 홈 화면 전용 주소
      const isHomeLink =
        params.get("home") === "1";

      // 독립 실행형 PWA
      const isStandalone =
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true;

      // 일반 공유 링크는 안내 화면 유지
      if (!isHomeLink && !isStandalone) return;

      if (!eventId) return;

      const url = new URL(window.location.href);

      url.searchParams.set("eventId", eventId);

      window.history.replaceState(
        null,
        "",
        url.toString()
      );

      openEvent();
    }

    /**************************************************
     * 화면 준비 후 실행
     **************************************************/
    if (document.readyState === "loading") {

      document.addEventListener(
        "DOMContentLoaded",
        PG_initializePage_
      );

    } else {
      PG_initializePage_();
    }

    /**************************************************
     * 뒤로 돌아왔을 때 버튼 복원
     **************************************************/
    window.addEventListener("pageshow", function() {

      const btn =
        document.getElementById("openEventBtn");

      btn.disabled = false;
      btn.textContent = "참가 신청 화면 열기";

      document.getElementById("loadingNote")
        .classList.remove("show");
    });

    /**************************************************
     * 홈 화면 설치 안내
     **************************************************/
    function toggleGuide() {

      const guide =
        document.getElementById("installGuide");

      const button =
        document.getElementById("guideBtn");

      const opened =
        guide.classList.toggle("show");

      button.setAttribute(
        "aria-expanded",
        String(opened)
      );

      button.textContent = opened
        ? "홈 화면에 바로가기 추가 ▲"
        : "홈 화면에 바로가기 추가 ▼";
    }

    /**************************************************
     * 홈 화면 바로가기 준비
     *
     * 별도 URL 배포 없이
     * 기존 공유 화면에서 바로 등록
     **************************************************/
    function installApp() {

      prepareHomeShortcut();
    }

    /**************************************************
     * 등록 안내 표시
     **************************************************/
    function showInstructions() {

      document.getElementById("instructions")
        .classList.add("show");
    }

    /**************************************************
     * PWA 서비스 워커 등록
     **************************************************/
    if ("serviceWorker" in navigator) {

      navigator.serviceWorker
        .register("./sw.js")

        .then(function() {
          console.log("PWA 서비스 워커 등록 완료");
        })

        .catch(function(error) {
          console.error("PWA 등록 실패:", error);
        });
    }

  </script>

</body>
</html>
