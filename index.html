
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#086cc5">
<title>대회 참가 신청</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:6px 10px;
  background:#f0f5fa;
  font-family:Arial,sans-serif;
  text-align:center;
  color:#073b65;
}

.card {
  max-width:460px;
  margin:4px auto;
  padding:16px 14px;
  background:white;
  border-radius:16px;
  box-shadow:0 3px 12px #0001;
}

h1 {
  font-size:25px;
  margin:0 0 14px;
}

button {
  width:100%;
  padding:13px 10px;
  border:0;
  border-radius:10px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.primary,.execute {
  background:#086cc5;
  color:white;
}

.primary:disabled {
  background:#538fbe;
}

.accordion {
  margin-top:10px;
  background:#e9f2fa;
  color:#073b65;
}

.guide {
  display:none;
  margin-top:8px;
  padding:12px;
  background:#f5f8fb;
  border:1px solid #d5e2ed;
  border-radius:10px;
  text-align:left;
  font-size:16px;
  line-height:1.4;
}

.guide.show { display:block; }

.guide-title {
  font-size:19px;
  font-weight:bold;
  text-align:center;
  margin-bottom:8px;
}

.guide p {
  margin:6px 0 10px;
  line-height:1.4;
}

.execute {
  margin:4px 0 12px;
}

.loading-note {
  display:none;
  margin-top:10px;
  font-size:16px;
  color:#49667d;
}

.loading-note.show { display:block; }
</style>
</head>

<body>
<div class="card">

<h1>🏌️ 대회 참가 신청</h1>

<div id="normalPage">

  <button class="primary"
          id="openEventBtn"
          onclick="openEvent()">
    참가 신청 화면 열기
  </button>

  <div class="loading-note"
       id="loadingNote"
       role="status"
       aria-live="polite">
    잠시만 기다려 주십시오.
  </div>

  <button class="accordion"
          id="guideBtn"
          aria-expanded="false"
          aria-controls="installGuide"
          onclick="toggleGuide()">
    홈 화면에 바로가기 추가 ▼
  </button>

  <div class="guide" id="installGuide">

    <div class="guide-title">
      📲 홈 화면 바로가기 방법
    </div>

    <button class="execute"
            id="homeShortcutBtn"
            onclick="executeHomeShortcut()">
      📲 홈 화면 바로가기 실행
    </button>

    <p>
      <b>① 카카오톡·밴드</b><br>
      메뉴(⋮) → 다른 브라우저로 열기
    </p>

    <p>
      <b>② 삼성 인터넷</b><br>
      메뉴(☰ 또는 ⋮) →
      홈 화면에 추가 → 추가
    </p>

    <p>
      <b>③ 크롬</b><br>
      메뉴(⋮) →
      홈 화면에 추가
    </p>

    <p>
      <b>④ 아이폰 Safari</b><br>
      공유 버튼 →
      홈 화면에 추가
    </p>

    <p>
      <b>⑤ 등록 후</b><br>
      홈 화면 아이콘을 누르면
      참가 신청 화면으로 바로 이동합니다.
    </p>

  </div>
</div>

<!-- 기존 setup=1 주소 호환 -->
<div id="setupPage" style="display:none;">

  <div class="guide show">

    <div class="guide-title">
      📲 홈 화면 바로가기 방법
    </div>

    <button class="execute"
            id="prepareHomeBtn"
            onclick="executeHomeShortcut()">
      📲 홈 화면 바로가기 실행
    </button>

    <p>
      실행 버튼을 누른 뒤
      브라우저 메뉴에서 홈 화면에 추가하십시오.
    </p>

  </div>
</div>

</div>

<script>
/**************************************************
 * 2026.11.23
 * 대회 참가 신청 GitHub 연결
 *
 * L열 기존 URL 유지
 * 일반 접속 : 안내 화면
 * 바로가기 실행 : home=1 주소 준비
 * 홈 화면 아이콘 : 참가 신청 자동 연결
 **************************************************/

const GS_BASE_URL =
  "https://script.google.com/macros/s/" +
  "AKfycbySUNGARDitfAqrmdNQoCO1Pb55l72CsMGznm1eay56Zd24ufCZBXfBX467NbIDa4M9" +
  "/exec";

const PG_EVENT_STORAGE_KEY = "PG_LAST_EVENT_ID";

/**************************************************
 * 대회ID 형식 확인
 **************************************************/
function PG_isValidEventId_(id) {
  return /^PG-\d{4}-\d{3,}$/.test(id || "");
}

/**************************************************
 * 대회ID 저장
 **************************************************/
function PG_saveEventId_(eventId) {
  if (!PG_isValidEventId_(eventId)) return;

  try {
    localStorage.setItem(PG_EVENT_STORAGE_KEY,eventId);
  } catch(error) {
    console.warn("대회ID 저장 실패:",error);
  }
}

/**************************************************
 * 기억된 대회ID 조회
 **************************************************/
function PG_getSavedEventId_() {
  try {
    const id = localStorage.getItem(PG_EVENT_STORAGE_KEY);
    return PG_isValidEventId_(id) ? id : "";
  } catch(error) {
    return "";
  }
}

/**************************************************
 * 대회ID 확인
 * - URL eventId
 * - 대회별 HTML 파일명
 * - 저장된 대회ID
 **************************************************/
function PG_getEventId_() {
  const params = new URLSearchParams(location.search);
  const requestedId = params.get("eventId");

  if (PG_isValidEventId_(requestedId)) {
    return requestedId;
  }

  const fileName = location.pathname.split("/").pop();
  const match = fileName.match(
    /^(PG-\d{4}-\d{3,})\.html$/i
  );

  if (match && PG_isValidEventId_(match[1])) {
    return match[1];
  }

  return PG_getSavedEventId_();
}

/**************************************************
 * 참가 신청 화면 열기
 **************************************************/
function openEvent() {
  const btn = document.getElementById("openEventBtn");

  if (btn.disabled) return;

  btn.disabled = true;
  btn.textContent = "⏳ 참가 신청 화면 연결 중...";

  document.getElementById("loadingNote")
    .classList.add("show");

  const params = new URLSearchParams(location.search);
  const eventId = PG_getEventId_();

  if (!eventId) {
    btn.disabled = false;
    btn.textContent = "참가 신청 화면 열기";
    document.getElementById("loadingNote")
      .textContent = "대회ID를 확인할 수 없습니다.";
    return;
  }

  const preview = params.get("preview");
  PG_saveEventId_(eventId);

  const url = new URL(GS_BASE_URL);
  url.searchParams.set("eventId",eventId);

  if (preview && /^\d+$/.test(preview)) {
    url.searchParams.set("preview",preview);
  }

  location.href = url.toString();
}

/**************************************************
 * 홈 화면 바로가기 주소 준비
 **************************************************/
function prepareHomeShortcut() {
  const eventId = PG_getEventId_();

  if (!eventId) {
    alert("대회ID를 확인할 수 없습니다.");
    return false;
  }

  PG_saveEventId_(eventId);

  const url = new URL(location.href);
  url.searchParams.delete("setup");
  url.searchParams.set("eventId",eventId);
  url.searchParams.set("home","1");

  history.replaceState(null,"",url.toString());

  return true;
}

/**************************************************
 * 홈 화면 바로가기 실행
 **************************************************/
function executeHomeShortcut() {

  if (!prepareHomeShortcut()) return;

  const btn = document.getElementById("homeShortcutBtn");
  if (btn) {
    btn.textContent = "✅ 바로가기 실행 준비 완료";
  }

  const setupBtn = document.getElementById("prepareHomeBtn");
  if (setupBtn) {
    setupBtn.textContent = "✅ 바로가기 실행 준비 완료";
  }
}

/**************************************************
 * 안내창 열기 / 닫기
 **************************************************/
function toggleGuide() {

  const guide = document.getElementById("installGuide");
  const btn = document.getElementById("guideBtn");

  const opened = guide.classList.toggle("show");

  btn.setAttribute("aria-expanded",String(opened));

  btn.textContent = opened
    ? "홈 화면에 바로가기 추가 ▲"
    : "홈 화면에 바로가기 추가 ▼";
}

/**************************************************
 * 최초 접속 화면 분기
 **************************************************/
function PG_initializePage_() {

  const params = new URLSearchParams(location.search);
  const eventId = PG_getEventId_();

  if (PG_isValidEventId_(eventId)) {
    PG_saveEventId_(eventId);
  }

  if (params.get("setup") === "1") {
    document.getElementById("normalPage")
      .style.display = "none";

    document.getElementById("setupPage")
      .style.display = "block";

    return;
  }

  const isHomeLink = params.get("home") === "1";

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    navigator.standalone === true;

  if (!isHomeLink && !isStandalone) return;
  if (!eventId) return;

  const url = new URL(location.href);
  url.searchParams.set("eventId",eventId);

  history.replaceState(null,"",url.toString());

  openEvent();
}

if (document.readyState === "loading") {
  document.addEventListener(
    "DOMContentLoaded",PG_initializePage_
  );
} else {
  PG_initializePage_();
}

/**************************************************
 * 뒤로 돌아왔을 때 버튼 복원
 **************************************************/
window.addEventListener("pageshow",function() {

  const btn = document.getElementById("openEventBtn");
  btn.disabled = false;
  btn.textContent = "참가 신청 화면 열기";

  document.getElementById("loadingNote")
    .classList.remove("show");
});

/**************************************************
 * PWA 서비스 워커 등록
 **************************************************/
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(function() {
      console.log("PWA 서비스 워커 등록 완료");
    })
    .catch(function(error) {
      console.error("PWA 등록 실패:",error);
    });
}
</script>
</body>
</html>
