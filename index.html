
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">


<title>대회 참가 신청</title>

<!-- 2026.11.24 대회별 바로가기 이름 자동 설정 -->
<script>
(function () {

  const params = new URLSearchParams(location.search);
  const eventName = params.get("eventName");

  if (!eventName) return;

  const name = eventName.trim();

  if (!name) return;

  document.title = name.includes("참가 신청")
    ? name
    : name + " 참가 신청";

})();
</script>


<link rel="icon" type="image/png" href="./parkgolf-192.png">
<link rel="apple-touch-icon" href="./parkgolf-192.png">
<meta name="theme-color" content="#086cc5">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:5px 10px;
  background:#f0f5fa;
  font-family:Arial,"Malgun Gothic",sans-serif;
  color:#073b65;
}

.card {
  max-width:460px;
  margin:4px auto;
  padding:15px 13px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
}

h1 {
  margin:0 0 13px;
  text-align:center;
  font-size:25px;
}

button {
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px 8px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.primary,.execute {
  background:#086cc5;
  color:#fff;
}

.accordion {
  margin-top:9px;
  background:#e7f1fa;
  color:#073b65;
}

.guide {
  display:none;
  margin-top:8px;
  padding:12px;
  border:1px solid #d4e0ed;
  border-radius:10px;
  background:#f5f8fb;
}

.guide.show { display:block; }

.guide-title {
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin:14px 0 10px;
}

.notice {
  font-size:16px;
  line-height:1.5;
  margin:0 0 12px;
  text-align:center;
}

#loadingNote {
  display:none;
  margin-top:8px;
  text-align:center;
  font-size:16px;
}

#shortcutPrepareBtn {
  display:none;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="card">

  <h1>🏌️ 대회 참가 신청</h1>

  <button class="primary"
          id="openEventBtn"
          onclick="openEvent()">
    참가 신청 화면 열기
  </button>

  <div id="loadingNote">
    참가 신청 화면 연결 중...
  </div>

  <button class="accordion"
          id="guideBtn"
          aria-expanded="false"
          aria-controls="installGuide"
          onclick="toggleGuide()">
    홈 화면에 바로가기 추가 ▼
  </button>

  <div class="guide" id="installGuide">

    <div class="guide-title" id="guideTitle">
      홈 화면에 바로가기를 추가하시겠습니까?
    </div>

    <div class="notice" id="guideMessage"></div>

    <button class="execute"
            id="shortcutPrepareBtn"
            onclick="prepareShortcut()">
      📲 바로가기 주소 준비
    </button>

  </div>

</div>

<script>
/**************************************************
 * 파크골프 참가 신청
 * 2026.11.24
 *
 * 일반 접속과 바로가기 실행 구분
 **************************************************/

const GS_BASE_URL =
  "https://script.google.com/macros/s/" +
  "AKfycbySUNGARDitfAqrmdNQoCO1Pb55l72CsMGznm1eay56Zd24ufCZBXfBX467NbIDa4M9" +
  "/exec";

const EVENT_KEY = "PG_LAST_EVENT_ID";

function validEventId(id) {
  return /^PG-\d{4}-\d{3,}$/.test(id || "");
}

function getEventId() {

  const params = new URLSearchParams(location.search);
  const queryId = params.get("eventId");

  if (validEventId(queryId)) return queryId;

  const file = location.pathname.split("/").pop();
  const match = file.match(/^(PG-\d{4}-\d{3,})\.html$/i);

  if (match && validEventId(match[1])) return match[1];

  try {
    const saved = localStorage.getItem(EVENT_KEY);
    return validEventId(saved) ? saved : "";
  } catch(e) {
    return "";
  }
}

function saveEventId(id) {
  if (!validEventId(id)) return;
  try {
    localStorage.setItem(EVENT_KEY,id);
  } catch(e) {
    console.warn(e);
  }
}

/**************************************************
 * GS 참가 신청 화면 열기
 **************************************************/
function openEvent() {

  const id = getEventId();

  if (!id) {
    alert("대회ID를 확인할 수 없습니다.");
    return;
  }

  saveEventId(id);

  const btn = document.getElementById("openEventBtn");
  btn.disabled = true;
  btn.textContent = "연결 중...";

  document.getElementById("loadingNote")
    .style.display = "block";

  const url = new URL(GS_BASE_URL);
  url.searchParams.set("eventId",id);

  const preview =
    new URLSearchParams(location.search).get("preview");

  if (preview && /^\d+$/.test(preview)) {
    url.searchParams.set("preview",preview);
  }

  location.href = url.toString();
}

/**************************************************
 * 브라우저 구분
 **************************************************/
function browserType() {

  const ua = navigator.userAgent || "";

  if (/KAKAOTALK|BAND\//i.test(ua)) return "inapp";
  if (/SamsungBrowser/i.test(ua)) return "samsung";
  if (/Chrome|CriOS/i.test(ua)) return "chrome";
  if (/Safari/i.test(ua)) return "safari";

  return "other";
}

/**************************************************
 * 안내창 표시
 **************************************************/
function showGuide() {

  const guide = document.getElementById("installGuide");
  const btn = document.getElementById("guideBtn");

  guide.classList.add("show");
  btn.textContent = "홈 화면에 바로가기 추가 ▲";
  btn.setAttribute("aria-expanded","true");
}

/**************************************************
 * 안내창 열기 / 닫기
 **************************************************/
function toggleGuide() {

  const guide = document.getElementById("installGuide");
  const btn = document.getElementById("guideBtn");

  const opened = guide.classList.toggle("show");

  btn.textContent = opened
    ? "홈 화면에 바로가기 추가 ▲"
    : "홈 화면에 바로가기 추가 ▼";

  btn.setAttribute("aria-expanded",String(opened));
}

/**************************************************
 * 브라우저별 안내문
 **************************************************/
function updateGuide() {

  const type = browserType();

  const message = document.getElementById("guideMessage");
  const prepareBtn =
    document.getElementById("shortcutPrepareBtn");

  prepareBtn.style.display = "none";

  if (type === "inapp") {

    message.innerHTML =
      "화면의 <b>점 세 개(⋮)</b>를 누르십시오.<br>" +
      "<b>「다른 브라우저로 열기」</b>를 선택하십시오.";

  } else if (type === "samsung") {

    message.innerHTML =
      "홈 화면 바로가기를 만들려면<br>" +
      "아래 버튼을 먼저 누르십시오.";

    prepareBtn.style.display = "block";

  } else if (type === "chrome") {

    message.innerHTML =
      "홈 화면 바로가기를 만들려면<br>" +
      "아래 버튼을 먼저 누르십시오.";

    prepareBtn.style.display = "block";

  } else if (type === "safari") {

    message.innerHTML =
      "공유 버튼을 누른 다음<br>" +
      "<b>「홈 화면에 추가」</b>를 선택하십시오.";

  } else {

    message.innerHTML =
      "브라우저 메뉴에서<br>" +
      "<b>「홈 화면에 추가」</b>를 선택하십시오.";
  }
}

/**************************************************
 * 바로가기 실행 주소 준비
 *
 * 사용자가 직접 버튼을 누를 때만
 * 현재 주소에 home=1을 추가합니다.
 **************************************************/
function prepareShortcut() {

  const id = getEventId();

  if (!id) {
    alert("대회ID를 확인할 수 없습니다.");
    return;
  }

  saveEventId(id);

  const url = new URL(location.href);

  url.searchParams.set("eventId",id);
  url.searchParams.set("home","1");
  url.searchParams.delete("setup");

  history.replaceState(null,"",url.toString());

  const message = document.getElementById("guideMessage");
  const prepareBtn =
    document.getElementById("shortcutPrepareBtn");

  prepareBtn.style.display = "none";

  if (browserType() === "samsung") {

    message.innerHTML =
      "<b>바로가기 주소가 준비되었습니다.</b><br><br>" +
      "화면 아래 <b>메뉴(☰ 또는 ⋮)</b>를 누르십시오.<br>" +
      "<b>「현재 페이지에 추가」</b>를 선택하십시오.<br>" +
      "<b>「홈 화면」 → 「추가」</b>를 누르십시오.";

  } else {

    message.innerHTML =
      "<b>바로가기 주소가 준비되었습니다.</b><br><br>" +
      "브라우저 메뉴에서 <b>「홈 화면에 추가」</b>를 선택하십시오.<br>" +
      "앱 설치 대신 바로가기 추가 항목이 있으면 선택하십시오.";
  }
}

/**************************************************
 * 화면 초기화
 **************************************************/
function initializePage() {

  const params = new URLSearchParams(location.search);
  const id = getEventId();

  if (id) saveEventId(id);

  // home=1 주소로 새로 접속한 경우
  if (params.get("home") === "1" && id) {
    openEvent();
    return;
  }

  updateGuide();

  // 외부 브라우저에서는 안내 자동 표시
  const type = browserType();

  if (type === "samsung" || type === "chrome" ||
      params.get("setup") === "1") {
    showGuide();
  }
}

/**************************************************
 * 화면 복원 시 처리
 **************************************************/
window.addEventListener("pageshow",function(event) {

  const params = new URLSearchParams(location.search);
  const id = getEventId();

  // 복원된 페이지에서 실행 주소이면 연결
  if (event.persisted && params.get("home") === "1" && id) {
    openEvent();
    return;
  }

  const btn = document.getElementById("openEventBtn");
  btn.disabled = false;
  btn.textContent = "참가 신청 화면 열기";

  document.getElementById("loadingNote")
    .style.display = "none";
});

/**************************************************
 * 화면 시작
 **************************************************/
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded",initializePage);
} else {
  initializePage();
}
</script>

</body>
</html>
