
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#086cc5">

  <title>파크골프 참가 신청</title>

  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f0f5fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #073b65;
    }

    .card {
      max-width: 460px;
      margin: 30px auto;
      padding: 24px 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0001;
    }

    h1 {
      font-size: 25px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 17px;
      border: 0;
      border-radius: 10px;
      background: #086cc5;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🏌️ 파크골프 참가 신청</h1>
    <p>참가 신청 화면으로 연결하고 있습니다.</p>

    <button onclick="openEvent()">
      참가 신청 화면 열기
    </button>
  </div>

  <script>
    /**************************************************
     * 대회별 전용 참가 신청 연결
     * 2026.11.23
     *
     * - 공유 URL의 대회ID로 연결
     * - 마지막 대회 저장 기능 사용 안 함
     * - 기존 GS 웹앱 유지
     **************************************************/

    const GS_BASE_URL =
      "https://script.google.com/macros/s/" +
      "AKfycbySUNGARDitfAqrmdNQoCO1Pb55l72CsMGznm1eay56Zd24ufCZBXfBX467NbIDa4M9" +
      "/exec";

    function openEvent() {

      const params =
        new URLSearchParams(window.location.search);

      const requestedId = params.get("eventId");
      const preview = params.get("preview");

      const eventId =
        requestedId &&
        /^PG-\d{4}-\d{3,}$/.test(requestedId)
          ? requestedId
          : "PG-2026-004";

      const url = new URL(GS_BASE_URL);

      url.searchParams.set("eventId", eventId);

      if (preview && /^\d+$/.test(preview)) {
        url.searchParams.set("preview", preview);
      }

      window.location.replace(url.toString());
    }

    // 화면이 열리면 해당 대회로 자동 이동
    window.addEventListener("load", function() {
      setTimeout(openEvent, 500);
    });

    /**************************************************
     * PWA 서비스 워커 등록
     **************************************************/
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("./sw.js")
        .then(function() {
          console.log("PWA 서비스 워커 등록 완료");
        })
        .catch(function(error) {
          console.error("PWA 등록 실패:", error);
        });
    }
  </script>

</body>
</html>
