
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#086cc5">

  <title>파크골프 참가 신청</title>

  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f0f5fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #073b65;
    }

    .card {
      max-width: 460px;
      margin: 30px auto;
      padding: 24px 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0001;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 20px;
    }

    button {
      width: 100%;
      padding: 16px 12px;
      border: 0;
      border-radius: 10px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #086cc5;
      color: white;
    }

    .accordion {
      margin-top: 14px;
      background: #e9f2fa;
      color: #073b65;
    }

    .guide {
      display: none;
      margin-top: 12px;
      padding: 15px;
      background: #f5f8fb;
      border: 1px solid #d5e2ed;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      line-height: 1.6;
    }

    .guide.show {
      display: block;
    }

    .install {
      background: #086cc5;
      color: white;
      margin-bottom: 12px;
    }

    .instructions {
      display: none;
    }

    .instructions.show {
      display: block;
    }

    .instructions p {
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🏌️ 파크골프 참가 신청</h1>

    <!-- 첫 번째 버튼 -->
    <button class="primary" onclick="openEvent()">
      참가 신청 화면 열기
    </button>

    <!-- 두 번째 버튼 : 아코디언 -->
    <button
      class="accordion"
      id="guideBtn"
      aria-expanded="false"
      aria-controls="installGuide"
      onclick="toggleGuide()">
      홈 화면에 바로가기 추가 ▼
    </button>

    <div class="guide" id="installGuide">

      <!-- 설치 버튼 -->
      <button class="install" onclick="installApp()">
        📲 홈 화면에 설치하기
      </button>

      <!-- 설치 안내문 -->
      <div class="instructions" id="instructions">

        <p>
          <b>① 카카오톡에서 접속한 경우</b><br>
          화면의 점 3개(⋮) →
          다른 브라우저로 열기
        </p>

        <p>
          <b>② 삼성 인터넷에서 홈 화면에 추가</b><br>
          하단 점 3개(⋮) →
          현재 페이지 추가 →
          홈 화면 → 추가
        </p>

        <p>
          <b>③ 크롬에서 홈 화면에 추가</b><br>
          메뉴(⋮) →
          홈 화면에 추가 또는 앱 설치
        </p>

        <p>
          <b>④ 아이폰 Safari에서 홈 화면에 추가</b><br>
          공유 버튼 →
          홈 화면에 추가
        </p>

      </div>

    </div>

  </div>

  <script>
    /**************************************************
     * 대회별 참가 신청 연결
     * 2026.11.23
     *
     * 공유 URL의 eventId와 preview를 전달
     * 기존 GS 웹앱은 수정하지 않음
     **************************************************/

    const GS_BASE_URL =
      "https://script.google.com/macros/s/" +
      "AKfycbySUNGARDitfAqrmdNQoCO1Pb55l72CsMGznm1eay56Zd24ufCZBXfBX467NbIDa4M9" +
      "/exec";

    function openEvent() {

      const params =
        new URLSearchParams(window.location.search);

      const requestedId = params.get("eventId");
      const preview = params.get("preview");

      const eventId =
        requestedId &&
        /^PG-\d{4}-\d{3,}$/.test(requestedId)
          ? requestedId
          : "PG-2026-004";

      const url = new URL(GS_BASE_URL);

      url.searchParams.set("eventId", eventId);

      if (preview && /^\d+$/.test(preview)) {
        url.searchParams.set("preview", preview);
      }

      window.location.href = url.toString();
    }

    /**************************************************
     * 홈 화면 설치 안내 아코디언
     **************************************************/
    function toggleGuide() {

      const guide =
        document.getElementById("installGuide");

      const button =
        document.getElementById("guideBtn");

      const opened =
        guide.classList.toggle("show");

      button.setAttribute(
        "aria-expanded",
        String(opened)
      );

      button.textContent = opened
        ? "홈 화면에 바로가기 추가 ▲"
        : "홈 화면에 바로가기 추가 ▼";
    }

    /**************************************************
     * 설치 확인창 호출
     * 지원하지 않는 브라우저에서는 안내문 표시
     **************************************************/
    let deferredPrompt = null;

    window.addEventListener(
      "beforeinstallprompt",
      function(event) {
        event.preventDefault();
        deferredPrompt = event;
      }
    );

    async function installApp() {

      if (deferredPrompt) {

        const promptEvent = deferredPrompt;
        deferredPrompt = null;

        try {
          await promptEvent.prompt();
        } catch (error) {
          console.warn("설치 요청 실패:", error);
          showInstructions();
        }

      } else {
        showInstructions();
      }
    }

    function showInstructions() {
      document.getElementById("instructions")
        .classList.add("show");
    }

    /**************************************************
     * PWA 서비스 워커 등록
     * 기존 기능 유지
     **************************************************/
    if ("serviceWorker" in navigator) {

      navigator.serviceWorker
        .register("./sw.js")

        .then(function() {
          console.log(
            "PWA 서비스 워커 등록 완료"
          );
        })

        .catch(function(error) {
          console.error(
            "PWA 등록 실패:",
            error
          );
        });
    }
  </script>

</body>
</html>
