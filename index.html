<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>대회 참가 신청</title>

<!-- 2026.11.26 대회별 바로가기 이름 자동 설정 -->
<script>
(function () {

  const params = new URLSearchParams(location.search);
  const eventName = params.get("eventName");

  if (!eventName) return;

  const name = eventName.trim();

  if (!name) return;

  document.title = name.includes("참가 신청")
    ? name
    : name + " 참가 신청";

})();
</script>

<link rel="icon" type="image/png"
      href="./parkgolf-entry-192.png">

<link rel="apple-touch-icon"
      href="./parkgolf-entry-192.png">

<meta name="theme-color" content="#086cc5">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:5px 10px;
  background:#f0f5fa;
  font-family:Arial,"Malgun Gothic",sans-serif;
  color:#073b65;
}

.card {
  max-width:460px;
  margin:4px auto;
  padding:15px 13px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 3px 12px #0001;
}

h1 {
  margin:0 0 13px;
  text-align:center;
  font-size:25px;
}

button {
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px 8px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.primary,.execute {
  background:#086cc5;
  color:#fff;
}

.accordion {
  margin-top:9px;
  background:#e7f1fa;
  color:#073b65;
}

.guide {
  display:none;
  margin-top:8px;
  padding:12px;
  border:1px solid #d4e0ed;
  border-radius:10px;
  background:#f5f8fb;
}

.guide.show { display:block; }

.guide-title {
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin:14px 0 10px;
}

.notice {
  font-size:16px;
  line-height:1.5;
  margin:0 0 12px;
  text-align:center;
}

#loadingNote {
  display:none;
  margin-top:8px;
  text-align:center;
  font-size:16px;
}

#shortcutPrepareBtn {
  display:none;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="card">

  <h1>🏌️ 대회 참가 신청</h1>

  <button class="primary"
          id="openEventBtn"
          onclick="openEvent()">
    참가 신청 화면 열기
  </button>

  <div id="loadingNote">
    참가 신청 화면 연결 중...
  </div>

  <button class="accordion"
          id="guideBtn"
          aria-expanded="false"
          aria-controls="installGuide"
          onclick="toggleGuide()">
    홈 화면에 바로가기 추가 ▼
  </button>

  <div class="guide" id="installGuide">

    <div class="guide-title" id="guideTitle">
      홈 화면에 바로가기를 추가하시겠습니까?
    </div>

    <div class="notice" id="guideMessage"></div>

    <!-- 2026.11.26 바로가기 추가 완료 버튼 -->
    <button id="shortcutCompleteBtn"
            class="primary"
            style="display:none; margin-top:20px;"
            onclick="completeShortcut()">
      ✓ 바로가기 추가 완료
    </button>

    <!-- 2026.11.26 바로가기 완료 메시지 -->
    <div id="shortcutCompleteArea"
         style="display:none; text-align:center;">

      <div style="
        color:#218838;
        font-size:36px;
        font-weight:700;
        margin:10px 0;
      ">
        ✓
      </div>

      <div style="
        color:#218838;
        font-size:20px;
        font-weight:700;
        line-height:1.5;
        margin-bottom:15px;
      ">
        홈 화면에 바로가기 추가가<br>
        완료되었습니다.
      </div>

      <div style="
        font-size:18px;
        line-height:1.5;
      ">
        이제 휴대전화 홈 화면의<br>
        아이콘을 터치하여 이용하십시오.
      </div>

      <button class="primary"
              style="margin-top:16px;"
              onclick="closeShortcutGuide()">
        확인
      </button>

    </div>

    <button class="execute"
            id="shortcutPrepareBtn"
            onclick="prepareShortcut()">
      📲 바로가기 주소 준비
    </button>

  </div>

</div>

<script>

/**************************************************
 * 파크골프 대회 참가 신청
 * 2026.11.26 Chrome 바로가기 개선 시험
 *
 * 대회 운영에서 검증된 방식 적용
 **************************************************/

const GS_BASE_URL =
  "https://script.google.com/macros/s/" +
  "AKfycbySUNGARDitfAqrmdNQoCO1Pb55l72CsMGznm1eay56Zd24ufCZBXfBX467NbIDa4M9" +
  "/exec";

const EVENT_KEY = "PG_LAST_EVENT_ID";

let shortcutReady = false;

/**************************************************
 * 대회ID 확인
 **************************************************/

function validEventId(id) {
  return /^PG-\d{4}-\d{3,}$/.test(id || "");
}

function getEventId() {

  const params = new URLSearchParams(location.search);
  const queryId = params.get("eventId");

  if (validEventId(queryId)) return queryId;

  const file = location.pathname.split("/").pop();
  const match = file.match(/^(PG-\d{4}-\d{3,})\.html$/i);

  if (match && validEventId(match[1])) return match[1];

  try {
    const saved = localStorage.getItem(EVENT_KEY);
    return validEventId(saved) ? saved : "";
  } catch(e) {
    return "";
  }
}

function saveEventId(id) {

  if (!validEventId(id)) return;

  try {
    localStorage.setItem(EVENT_KEY,id);
  } catch(e) {
    console.warn(e);
  }
}

/**************************************************
 * GS 참가 신청 화면 열기
 **************************************************/

function openEvent() {

  const id = getEventId();

  if (!id) {
    alert("대회ID를 확인할 수 없습니다.");
    return;
  }

  saveEventId(id);

  const btn = document.getElementById("openEventBtn");

  btn.disabled = true;
  btn.textContent = "연결 중...";

  document.getElementById("loadingNote")
    .style.display = "block";

  const url = new URL(GS_BASE_URL);

  url.searchParams.set("eventId",id);

  const preview =
    new URLSearchParams(location.search).get("preview");

  if (preview && /^\d+$/.test(preview)) {
    url.searchParams.set("preview",preview);
  }

  location.href = url.toString();
}

/**************************************************
 * 브라우저 구분
 **************************************************/

const UA = navigator.userAgent || "";

const IS_KAKAO =
  /KAKAOTALK|KAKAO/i.test(UA);

const IS_SAMSUNG =
  /SamsungBrowser/i.test(UA);

const IS_BAND_LIKE =
  !IS_KAKAO &&
  !IS_SAMSUNG &&
  /Android/i.test(UA) &&
  /Chrome/i.test(UA) &&
  !window.matchMedia("(display-mode: browser)").matches &&
  !window.matchMedia("(display-mode: standalone)").matches;

function browserType() {

  if (IS_BAND_LIKE) return "band";

  if (/KAKAOTALK|KAKAO|BAND/i.test(UA))
    return "inapp";

  if (IS_SAMSUNG) return "samsung";

  if (/Chrome|CriOS/i.test(UA))
    return "chrome";

  if (/Safari/i.test(UA))
    return "safari";

  return "other";
}

/**************************************************
 * 안내창 표시
 * 2026.11.26 펼치기 버튼 숨김 개선
 **************************************************/

function showGuide() {

  const guide = document.getElementById("installGuide");
  const btn = document.getElementById("guideBtn");

  guide.classList.add("show");

  // 2026.11.26 안내창 표시 시 펼치기 버튼 숨김
  btn.style.display = "none";

  btn.textContent = "홈 화면에 바로가기 추가 ▲";

  btn.setAttribute("aria-expanded","true");
}

/**************************************************
 * 안내창 열기 / 닫기
 **************************************************/

function toggleGuide() {

  const guide = document.getElementById("installGuide");
  const btn = document.getElementById("guideBtn");

  const opened = guide.classList.toggle("show");

  btn.textContent = opened
    ? "홈 화면에 바로가기 추가 ▲"
    : "홈 화면에 바로가기 추가 ▼";

  btn.setAttribute("aria-expanded",String(opened));

  // 2026.11.26 안내창이 열려 있는 동안 버튼 숨김
  btn.style.display = opened ? "none" : "block";

  if (opened && !shortcutReady) {
    updateGuide();
  }
}

/**************************************************
 * 브라우저별 안내문
 **************************************************/

function updateGuide() {

  const type = browserType();

  const message =
    document.getElementById("guideMessage");

  const prepareBtn =
    document.getElementById("shortcutPrepareBtn");

  prepareBtn.style.display = "none";

  if (type === "band") {

    message.innerHTML =
      "화면 상단의 <b>점 세 개(⋮)</b>를 누르십시오.<br>" +
      "<b>「삼성 인터넷 브라우저에서 열기」</b>를 선택하십시오.";

  } else if (type === "inapp") {

    message.innerHTML =
      "화면의 <b>점 세 개(⋮)</b>를 누르십시오.<br>" +
      "<b>「다른 브라우저로 열기」</b>를 선택하십시오.";

  } else if (type === "samsung") {

    message.innerHTML =
      "홈 화면 바로가기를 만들려면<br>" +
      "아래 버튼을 먼저 누르십시오.";

    prepareBtn.style.display = "block";

  } else if (type === "chrome") {

    message.innerHTML =
      "홈 화면 바로가기를 만들려면<br>" +
      "아래 버튼을 먼저 누르십시오.";

    prepareBtn.style.display = "block";

  } else if (type === "safari") {

    message.innerHTML =
      "공유 버튼을 누른 다음<br>" +
      "<b>「홈 화면에 추가」</b>를 선택하십시오.";

  } else {

    message.innerHTML =
      "브라우저 메뉴에서<br>" +
      "<b>「홈 화면에 추가」</b>를 선택하십시오.";
  }
}

/**************************************************
 * 핵심 개선 ①
 * 바로가기 준비 주소를 실제로 불러오기
 * 2026.11.26
 **************************************************/

function prepareShortcut() {

  const id = getEventId();

  if (!id) {
    alert("대회ID를 확인할 수 없습니다.");
    return;
  }

  saveEventId(id);

  const url = new URL(location.href);

  url.searchParams.set("eventId",id);
  url.searchParams.set("home","1");
  url.searchParams.set("setup","1");

  // 대회 운영에서 검증된 실제 페이지 이동 방식
  location.replace(url.toString());

}

/**************************************************
 * 핵심 개선 ②
 * 바로가기 주소 준비 완료
 * 2026.11.26
 **************************************************/

function showReady() {

  const url = new URL(location.href);

  url.searchParams.delete("setup");

  history.replaceState(null,"",url.toString());

  shortcutReady = true;

  showGuide();

  // 2026.11.26 준비 완료 시 중복 안내 제목 숨기기
  document.getElementById("guideTitle")
    .style.display = "none";

  // 2026.11.26 바로가기 추가 완료 버튼 표시
  document.getElementById("shortcutCompleteBtn")
    .style.display = "block";

  const message =
    document.getElementById("guideMessage");

  const prepareBtn =
    document.getElementById("shortcutPrepareBtn");

  prepareBtn.style.display = "none";

  // 삼성 인터넷 전용 안내문
  if (browserType() === "samsung") {

    message.innerHTML =
      "<b>바로가기 주소가 준비되었습니다.</b><br><br>" +
      "화면 아래 <b>메뉴(☰ 또는 ⋮)</b>를 누르십시오.<br>" +
      "<b>「현재 페이지에 추가」</b>를 선택하십시오.<br>" +
      "<b>「홈 화면」 → 「추가」</b>를 누르십시오.";

  // Chrome 전용 안내문
  } else if (browserType() === "chrome") {

    message.innerHTML =
      "<b>바로가기 주소가 준비되었습니다.</b><br><br>" +
      "브라우저 <b>메뉴(⋮)</b>를 누르십시오.<br>" +
      "<b>「설치 및 바로가기 만들기」</b> 선택 후<br>" +
      "<b>「바로가기 만들기」 → 「추가」</b>를 누르십시오.";

  // 기타 브라우저
  } else {

    message.innerHTML =
      "<b>바로가기 주소가 준비되었습니다.</b><br><br>" +
      "브라우저 메뉴에서 <b>「홈 화면에 추가」</b>를 선택하십시오.";

  }
}

/**************************************************
 * 2026.11.26 바로가기 추가 완료 확인
 **************************************************/

function completeShortcut() {

  // 기존 안내 제목 숨기기
  document.getElementById("guideTitle")
    .style.display = "none";

  // 기존 안내문 숨기기
  document.getElementById("guideMessage")
    .style.display = "none";

  // 주소 준비 버튼 숨기기
  document.getElementById("shortcutPrepareBtn")
    .style.display = "none";

  // 완료 버튼 숨기기
  document.getElementById("shortcutCompleteBtn")
    .style.display = "none";

  // 완료 메시지 표시
  document.getElementById("shortcutCompleteArea")
    .style.display = "block";

}

/**************************************************
 * 2026.11.26 완료 확인 후 안내창 닫기
 **************************************************/

function closeShortcutGuide() {

  document.getElementById("installGuide")
    .classList.remove("show");

  const btn =
    document.getElementById("guideBtn");

  btn.textContent =
    "홈 화면에 바로가기 추가 ▼";

  btn.setAttribute("aria-expanded","false");

  // 2026.11.26 완료 확인 후 최초 버튼 복원
  btn.style.display = "block";

}

/**************************************************
 * 핵심 개선 ③
 * 화면 초기화
 * 2026.11.26
 **************************************************/

function initializePage() {

  const params = new URLSearchParams(location.search);
  const id = getEventId();

  if (id) saveEventId(id);

  const type = browserType();

  // 홈 화면 바로가기 실행
  if (
    params.get("home") === "1" &&
    params.get("setup") !== "1" &&
    id
  ) {

    document.documentElement.style.visibility = "hidden";

    openEvent();

    return;
  }

  // 밴드 내부 브라우저
  if (type === "band") {

    const btn = document.getElementById("guideBtn");

    // 2026.11.26 밴드 안내 화면에서 버튼 숨김
    btn.style.display = "none";

    updateGuide();
    showGuide();

    return;
  }

  // 바로가기 주소 준비 완료
  if (
    params.get("home") === "1" &&
    params.get("setup") === "1" &&
    id
  ) {

    showReady();

    return;
  }

  // 일반 접속
  updateGuide();

  if (
    type === "samsung" ||
    type === "chrome" ||
    params.get("setup") === "1"
  ) {

    showGuide();

  }
}

/**************************************************
 * 화면 복원 시 처리
 **************************************************/

window.addEventListener("pageshow",function(event) {

  const params = new URLSearchParams(location.search);
  const id = getEventId();

  if (
    event.persisted &&
    !shortcutReady &&
    params.get("home") === "1" &&
    params.get("setup") !== "1" &&
    id
  ) {

    openEvent();

    return;
  }

  document.documentElement.style.visibility = "visible";

  const btn = document.getElementById("openEventBtn");

  btn.disabled = false;
  btn.textContent = "참가 신청 화면 열기";

  document.getElementById("loadingNote")
    .style.display = "none";

});

/**************************************************
 * 화면 시작
 **************************************************/

if (document.readyState === "loading") {

  document.addEventListener(
    "DOMContentLoaded",
    initializePage
  );

} else {

  initializePage();

}

</script>

</body>
</html>
